<div>
  <h2>Switch Case</h2>

  @switch(orderStatus){

      @case("Shipped"){
        <p>Your order has been shipped</p>
      }

      @case("Pending"){
        <p>Your order is waiting for confirmation</p>
      }

      @case("Delivered"){
        <p>Your order has beedn delivered</p>
      }
      @case("cancelled"){
        <p>Your Order has been cancelled</p>
      }
      @default{
        <p>Unknown Order status</p>
      }

  }
</div>
